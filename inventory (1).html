<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockroom</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2733;--mute:#66768a;--line:#d6dde5;--acc:#0f6e6e;--acc-ink:#fff;--warn:#b86e00;--warn-bg:#fff1d6;--bad:#b3261e;
--font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181f;--panel:#1a232d;--ink:#e6edf3;--mute:#8d9db0;--line:#2c3947;--acc:#4fc3bd;--acc-ink:#07201f;--warn:#f0b04a;--warn-bg:#3a2c10;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181f;--panel:#1a232d;--ink:#e6edf3;--mute:#8d9db0;--line:#2c3947;--acc:#4fc3bd;--acc-ink:#07201f;--warn:#f0b04a;--warn-bg:#3a2c10;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.stats{display:flex;gap:20px;color:var(--mute);font-size:13px}
.stats b{display:block;color:var(--ink);font-size:20px;font-weight:600}
.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.side{padding:12px}
.side h2,.main h2{font-size:14px;margin:0 0 8px;font-weight:600}
.cat{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.cat:hover{background:var(--bg)}
.cat.on{background:var(--acc);color:var(--acc-ink)}
.cat .code{font-size:11px;opacity:.7;margin-left:auto}
.cat .n{font-size:12px;opacity:.8}
.cat-row{display:flex;align-items:center}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad)}
.addcat{display:grid;grid-template-columns:1fr 64px auto;gap:6px;margin-top:10px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tools{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.tools input{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.sub{color:var(--mute);font-size:12px}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:inherit;cursor:pointer;line-height:1}
.low{background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px;display:grid;gap:12px}
form h2{margin:0;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);font-weight:600}
.skubox{display:grid;grid-template-columns:1fr auto;gap:6px}
.skubox input{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}
.acts{display:flex;justify-content:flex-end;gap:8px}
.sec td{background:var(--bg);font-weight:600;color:var(--mute);font-size:13px;padding-top:16px}
.soldrow td{opacity:.7}
.tools{flex-wrap:wrap}.tools input{min-width:160px}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 10px;cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:12px}
.sumgrid div{background:var(--bg);border-radius:6px;padding:10px}
.sumgrid b{display:block;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stockroom</h1>
    <div class="stats" id="stats"></div>
  </header>
  <div class="layout">
    <aside class="panel side">
      <h2>Categories</h2>
      <div id="cats"></div>
      <div class="addcat">
        <input id="cname" placeholder="New category" aria-label="Category name" maxlength="30">
        <input id="ccode" placeholder="Code" aria-label="Category code" maxlength="4">
        <button class="btn" id="cadd">Add</button>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-weight:500"><input type="checkbox" id="ctrack" checked style="width:auto"> Counts stock (uncheck for one-off items)</label>
      <div class="err" id="cerr"></div>
      <h2 style="margin-top:18px">Column order</h2>
      <div id="colorder"></div>
      <h2 style="margin-top:18px">Custom columns</h2>
      <div id="fields"></div>
      <div class="addcat" style="grid-template-columns:1fr auto"><input id="fldname" placeholder="e.g. Color, Size, Bin" aria-label="Column name" maxlength="24"><button class="btn" id="fadd">Add</button></div>
    </aside>
    <main class="panel main">
      <div class="tabs"><button class="tab on" data-tab="inv">Inventory</button><button class="tab" data-tab="sales">Sales &amp; profit</button></div>
      <div id="invview"><div class="tools">
        <input id="q" type="search" placeholder="Search name, SKU or supplier" aria-label="Search products"><select id="fstat" aria-label="Status filter" style="width:auto"><option value="all">All items</option><option value="avail">Available</option><option value="sold">Sold / out</option><option value="low">Low stock</option></select><select id="fsort" aria-label="Sort" style="width:auto"><option value="sold">Sort: default</option><option value="new">Sort: newest first</option><option value="name">Sort: name A–Z</option><option value="price">Sort: price high–low</option><option value="margin">Sort: margin high–low</option></select>
        <button class="btn pri" id="new">Add product</button>
      </div>
      <div class="tw"><table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="empty" id="empty" hidden></div></div>
      <div id="salesview" hidden>
        <div class="tools"><select id="range" aria-label="Date range" style="width:auto"><option value="all">All time</option><option value="month">This month</option><option value="year">This year</option></select><button class="btn" id="csvbtn">Show CSV for spreadsheet</button></div>
        <div class="sumgrid" id="sum"></div>
        <textarea id="csv" rows="6" readonly hidden style="margin:0 12px 12px;width:calc(100% - 24px)"></textarea>
        <div class="tw"><table><thead><tr><th>Date</th><th>SKU</th><th>Product</th><th>Qty</th><th>Revenue</th><th>Fees</th><th>Cost</th><th>Profit</th><th></th></tr></thead><tbody id="srows"></tbody></table></div>
        <div class="empty" id="sempty" hidden>No sales yet. Click Sell on a product to record one.</div>
      </div>
    </main>
  </div>
</div>

<dialog id="dlg">
  <form id="f" method="dialog" onsubmit="return false">
    <h2 id="ftitle">Add product</h2>
    <label>Product name<input id="fname" maxlength="60" autocomplete="off"></label>
    <div class="g2">
      <label>Category<select id="fcat"></select></label>
      <label>List price ($)<input id="fprice" type="number" min="0" step="0.01" value="0"></label>
    </div>
    <label>SKU
      <div class="skubox"><input id="fsku" autocomplete="off"><button type="button" class="btn" id="regen">Regenerate</button></div>
    </label>
    <div class="g2">
      <label style="grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="ftrack" style="width:auto"> Track quantity (uncheck for one-off items)</label>
      <label class="qrow">Quantity in stock<input id="fqty" type="number" min="0" step="1" value="0"></label>
      <label class="qrow">Low-stock alert at<input id="fmin" type="number" min="0" step="1" value="5"></label>
    </div>
    <label>Supplier<input id="fsup" maxlength="60"></label>
    <label>Notes<textarea id="fnotes" rows="2" maxlength="300"></textarea></label>
    <label>Cost paid ($)<input id="fcost" type="number" min="0" step="0.01" value="0"></label>
    <div id="xfields" class="g2"></div>
    <div class="err" id="ferr"></div>
    <div class="acts"><button type="button" class="btn" id="fcancel">Cancel</button><button type="button" class="btn pri" id="fsave">Save product</button></div>
  </form>
</dialog>

<dialog id="sdlg"><form onsubmit="return false"><h2 id="stitle">Record sale</h2>
<div class="g2"><label>Sale price each ($)<input id="sprice" type="number" min="0" step="0.01"></label><label id="sqlab">Quantity sold<input id="sqty" type="number" min="1" step="1" value="1"></label></div>
<div class="g2"><label>Fees &amp; shipping ($)<input id="sfees" type="number" min="0" step="0.01" value="0"></label><label>Date sold<input id="sdate" type="date"></label></div>
<div class="err" id="serr"></div><div class="acts"><button type="button" class="btn" id="scancel">Cancel</button><button type="button" class="btn pri" id="ssave">Save sale</button></div></form></dialog>
<script>
(function(){
var KEY="stockroom-v1", S, filter="all", editId=null, skuTouched=false, view="inv", saleId=null;
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function codeFrom(n){var w=n.toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim();return (w.replace(/ /g,"").slice(0,3))||"GEN"}
function namePart(n){var w=n.toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim().split(/\s+/).filter(Boolean);
  if(!w.length)return "ITEM";
  if(w.length===1)return w[0].slice(0,4);
  return w.slice(0,4).map(function(x){return x.slice(0,w.length>2?1:2)}).join("").slice(0,4)}
function skuTaken(s,ex){return S.prods.some(function(p){return p.sku===s&&p.id!==ex})}
function genSku(catId,name){
  var c=S.cats.find(function(x){return x.id===catId});var code=c?c.code:"GEN";
  var n=(S.seq[code]||0),s;
  do{n++;s=code+"-"+String(n).padStart(4,"0")}while(skuTaken(s,editId));
  return {sku:s,n:n,code:code}}
function catName(id){var c=S.cats.find(function(x){return x.id===id});return c?c.name:"Uncategorized"}
function money(v){return "$"+Number(v).toFixed(2)}

function init(){
  S=load();if(S){S.fields=S.fields||[];S.sales=S.sales||[];S.prods.forEach(function(p){p.sold=p.sold||0;p.x=p.x||{}})}
  if(!S){
    S={cats:[],prods:[],seq:{},fields:[],sales:[]};
    var a=uid(),k=uid();
    S.cats.push({id:a,name:"Apparel",code:"APP"},{id:k,name:"Kitchen",code:"KIT"});
    [["Cotton T-Shirt",a,18,40,10,"Northline Textiles"],["Ceramic Mug",k,12.5,6,8,"Clayworks"],["Chef’s Knife",k,64,15,4,"Sora Steel"]].forEach(function(d){
      var g=genSku(d[1],d[0]);S.seq[g.code]=g.n;
      S.prods.push({id:uid(),sku:g.sku,name:d[0],cat:d[1],price:d[2],qty:d[3],min:d[4],sup:d[5],notes:"",sold:0,x:{}})});
    save()}
  render()}

var BASE=["sku","name","cat","price","cost","stock","sold"];
function defKeys(){return BASE.concat(S.fields.map(function(f){return "f:"+f.id}))}
function colKeys(){var d=defKeys(),o=(S.order||[]).filter(function(k){return d.indexOf(k)>-1});d.forEach(function(k){if(o.indexOf(k)<0)o.push(k)});return o}
function colLabel(k){var n={sku:"SKU",name:"Product",cat:"Category",price:"Price",cost:"Cost",stock:"In stock",sold:"Sold"};if(n[k])return n[k];var f=S.fields.find(function(x){return "f:"+x.id===k});return f?f.name:k}
function applyOrder(){var d=defKeys(),o=colKeys();
 Array.prototype.forEach.call(document.querySelectorAll("#head tr,#rows tr:not(.sec)"),function(tr){var c=Array.prototype.slice.call(tr.children),last=c[c.length-1],fr=document.createDocumentFragment();
  o.forEach(function(k){fr.appendChild(c[d.indexOf(k)])});fr.appendChild(last);tr.appendChild(fr)})}
function renderColList(){var o=colKeys();$("colorder").innerHTML=o.map(function(k,i){var l=esc(colLabel(k));return '<div class="cat-row"><span style="flex:1;padding:3px 8px;font-size:13px">'+l+'</span><button class="x" data-mv="'+k+'" data-dir="-1"'+(i?'':' disabled')+' aria-label="Move '+l+' left" title="Move left">←</button><button class="x" data-mv="'+k+'" data-dir="1"'+(i<o.length-1?'':' disabled')+' aria-label="Move '+l+' right" title="Move right">→</button></div>'}).join("")}
function isSold(p){return p.qty===0}
function sortList(l){var m=$("fsort").value,a=l.map(function(p,i){return{p:p,i:i}});
 a.sort(function(x,y){var P=x.p,Q=y.p,r=0;
  if(m==="sold")r=(isSold(P)?1:0)-(isSold(Q)?1:0);
  else if(m==="name")r=P.name.localeCompare(Q.name);
  else if(m==="price")r=Q.price-P.price;
  else if(m==="margin")r=(Q.price-(Q.cost||0))-(P.price-(P.cost||0));
  else if(m==="new")r=y.i-x.i;
  return r||(m==="sold"?y.i-x.i:x.i-y.i)});
 return a.map(function(o){return o.p})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function openSale(id){var p=S.prods.find(function(x){return x.id===id});if(!p)return;saleId=id;
 $("stitle").textContent="Sell "+p.name;$("sprice").value=p.price;$("sqty").value=1;$("sfees").value=0;$("sdate").value=today();$("serr").textContent="";
 $("sqlab").style.display=p.track===false?"none":"";$("sdlg").showModal();$("sprice").focus()}
function saveSale(){var p=S.prods.find(function(x){return x.id===saleId});if(!p)return;
 var qty=p.track===false?1:(parseInt($("sqty").value)||0),price=parseFloat($("sprice").value),fees=parseFloat($("sfees").value)||0,date=$("sdate").value;
 if(!(price>=0)){$("serr").textContent="Enter the sale price.";return}
 if(qty<1||qty>p.qty){$("serr").textContent="Quantity must be between 1 and "+p.qty+".";return}
 if(!date){$("serr").textContent="Pick the date sold.";return}
 S.sales.push({id:uid(),pid:p.id,sku:p.sku,name:p.name,cat:catName(p.cat),qty:qty,price:price,fees:fees,cost:p.cost||0,date:date});
 p.qty-=qty;p.sold=(p.sold||0)+qty;save();$("sdlg").close();render()}
function voidSale(id){var s=S.sales.find(function(x){return x.id===id});if(!s)return;
 var p=S.prods.find(function(x){return x.id===s.pid});if(p){p.qty+=s.qty;p.sold=Math.max(0,(p.sold||0)-s.qty)}
 S.sales=S.sales.filter(function(x){return x!==s});save();render()}
function inRange(d){var r=$("range").value,t=today();if(r==="month")return d.slice(0,7)===t.slice(0,7);if(r==="year")return d.slice(0,4)===t.slice(0,4);return true}
function renderSales(){var l=S.sales.filter(function(s){return inRange(s.date)}).sort(function(a,b){return b.date.localeCompare(a.date)});
 var rev=0,cogs=0,fees=0;
 $("srows").innerHTML=l.map(function(s){var r=s.price*s.qty,c=s.cost*s.qty,pr=r-s.fees-c;rev+=r;cogs+=c;fees+=s.fees;
  return '<tr><td>'+esc(s.date)+'</td><td class="sku">'+esc(s.sku)+'</td><td>'+esc(s.name)+'</td><td>'+s.qty+'</td><td>'+money(r)+'</td><td>'+money(s.fees)+'</td><td>'+money(c)+'</td><td style="font-weight:600;color:'+(pr<0?'var(--bad)':'inherit')+'">'+money(pr)+'</td><td><button class="x" data-vs="'+s.id+'" aria-label="Void sale of '+esc(s.name)+'" title="Void sale and restore stock">×</button></td></tr>'}).join("");
 var prof=rev-cogs-fees,inv=0;S.prods.forEach(function(p){if(p.qty>0)inv+=p.qty*(p.cost||0)});
 function box(a,b){return '<div><span class="sub">'+a+'</span><b>'+b+'</b></div>'}
 $("sum").innerHTML=box("Revenue",money(rev))+box("Cost of items sold",money(cogs))+box("Fees &amp; shipping",money(fees))+box("Profit",money(prof))+box("Margin",rev?Math.round(prof/rev*100)+"%":"–")+box("Stock at cost",money(inv));
 $("sempty").hidden=l.length>0;
 var rows=[["Date","SKU","Product","Category","Qty","Sale price each","Fees","Cost each","Profit"]].concat(l.map(function(s){return[s.date,s.sku,s.name,s.cat,s.qty,s.price.toFixed(2),s.fees.toFixed(2),s.cost.toFixed(2),(s.price*s.qty-s.fees-s.cost*s.qty).toFixed(2)]}));
 $("csv").value=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n")}
function catTrack(id){var c=S.cats.find(function(x){return x.id===id});return !c||c.track!==false}
function syncTrack(){var on=$("ftrack").checked;Array.prototype.forEach.call(document.querySelectorAll(".qrow"),function(l){l.style.display=on?"":"none"})}
function renderFields(){$("fields").innerHTML=S.fields.length?S.fields.map(function(f){return '<div class="cat-row"><span style="flex:1;padding:4px 8px">'+esc(f.name)+'</span><button class="x" data-df="'+f.id+'" aria-label="Delete column '+esc(f.name)+'">×</button></div>'}).join(""):'<div class="sub" style="padding:0 8px 6px">None yet. Add one below.</div>'}
function render(){
  $("head").innerHTML='<tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Cost</th><th>In stock</th><th>Sold</th>'+S.fields.map(function(f){return '<th>'+esc(f.name)+'</th>'}).join("")+'<th></th></tr>';renderFields();
  var cats=$("cats"),h='<div class="cat-row"><button class="cat'+(filter==="all"?" on":"")+'" data-f="all">All products<span class="code n">'+S.prods.length+'</span></button></div>';
  S.cats.forEach(function(c){
    var n=S.prods.filter(function(p){return p.cat===c.id}).length;
    h+='<div class="cat-row"><button class="cat'+(filter===c.id?" on":"")+'" data-f="'+c.id+'">'+esc(c.name)+'<span class="code">'+esc(c.code)+' · '+n+'</span></button><button class="x" style="font-size:11px" data-tc="'+c.id+'" title="Click to change whether this category counts stock">'+(c.track===false?'One-off':'Stock')+'</button><button class="x" data-dc="'+c.id+'" aria-label="Delete category '+esc(c.name)+'">×</button></div>'});
  cats.innerHTML=h;
  var q=$("q").value.trim().toLowerCase();
  var list=S.prods.filter(function(p){
    if(filter!=="all"&&p.cat!==filter)return false;
    var st=$("fstat").value,sd=isSold(p);if(st==="avail"&&sd)return false;if(st==="sold"&&!sd)return false;if(st==="low"&&!(p.track!==false&&!sd&&p.qty<=p.min))return false;
    return !q||(p.name+" "+p.sku+" "+(p.sup||"")).toLowerCase().indexOf(q)>-1});
  list=sortList(list);list=list.filter(function(p){return !isSold(p)}).concat(list.filter(isSold));
  var fs=list.filter(isSold)[0],ns=list.filter(isSold).length;$("rows").innerHTML=list.map(function(p){
    var low=p.qty<=p.min;
    return (p===fs?'<tr class="sec"><td colspan="'+(8+S.fields.length)+'">Sold / out of stock ('+ns+')</td></tr>':'')+'<tr'+(isSold(p)?' class="soldrow"':'')+'><td class="sku">'+esc(p.sku)+'</td><td>'+esc(p.name)+(p.sup?'<div class="sub">'+esc(p.sup)+'</div>':'')+'</td><td>'+esc(catName(p.cat))+'</td><td>'+money(p.price)+'</td><td>'+money(p.cost||0)+'</td><td>'+(p.track===false?(p.qty>0?'Available':'<span class="low">Sold</span>'):'<span class="qty"><b>'+p.qty+'</b><button data-q="1" data-id="'+p.id+'" aria-label="Restock one">+</button></span>'+(p.qty===0?'<span class="low">Out</span>':low?'<span class="low">Low</span>':''))+'</td><td>'+(p.sold||0)+'</td>'+S.fields.map(function(f){return '<td>'+esc((p.x&&p.x[f.id])||"")+'</td>'}).join("")+'<td style="white-space:nowrap">'+(p.track===false&&p.qty===0?'<button class="btn" data-undo="'+p.id+'">Undo sale</button> ':'<button class="btn" data-sell="'+p.id+'"'+(p.qty?'':' disabled')+'>'+(p.track===false?'Mark sold':'Sell')+'</button> ')+'<button class="btn" data-e="'+p.id+'">Edit</button> <button class="x" data-d="'+p.id+'" aria-label="Delete '+esc(p.name)+'">×</button></td></tr>'}).join("");
  var em=$("empty");em.hidden=list.length>0;
  em.textContent=S.prods.length?"No products match. Clear the search or pick another category.":"No products yet. Add your first product to generate its SKU.";
  var units=0,val=0,lows=0;S.prods.forEach(function(p){units+=p.qty;val+=p.qty*p.price;if(p.track!==false&&p.qty<=p.min)lows++});
  $("stats").innerHTML='<span><b>'+S.prods.length+'</b>products</span><span><b>'+units+'</b>units</span><span><b>'+money(val)+'</b>stock value</span><span><b>'+money(S.sales.reduce(function(a,s){return a+s.price*s.qty-s.fees-s.cost*s.qty},0))+'</b>profit to date</span><span><b>'+lows+'</b>low stock</span>';
  $("invview").hidden=view!=="inv";$("salesview").hidden=view!=="sales";Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.classList.toggle("on",b.dataset.tab===view)});applyOrder();renderColList();if(view==="sales")renderSales()}

function fillCatSelect(sel){$("fcat").innerHTML=S.cats.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+' ('+esc(c.code)+')</option>'}).join("");if(sel)$("fcat").value=sel}
function refreshSku(){if(skuTouched&&editId)return;$("fsku").value=genSku($("fcat").value,$("fname").value).sku}
function openForm(id){
  if(!S.cats.length){$("cerr").textContent="Create a category first.";$("cname").focus();return}
  editId=id||null;skuTouched=!!id;$("ferr").textContent="";
  var p=id&&S.prods.find(function(x){return x.id===id});
  $("ftitle").textContent=p?"Edit product":"Add product";
  fillCatSelect(p?p.cat:(filter!=="all"?filter:S.cats[0].id));
  $("fname").value=p?p.name:"";$("fprice").value=p?p.price:0;$("fqty").value=p?p.qty:0;$("fmin").value=p?p.min:5;
  $("fsup").value=p?p.sup||"":"";$("fnotes").value=p?p.notes||"":"";
  $("fcost").value=p?p.cost||0:0;$("ftrack").checked=p?p.track!==false:catTrack($("fcat").value);syncTrack();$("xfields").innerHTML=S.fields.map(function(f){return '<label>'+esc(f.name)+'<input data-xf="'+f.id+'" maxlength="60" value="'+esc(p&&p.x&&p.x[f.id]||"")+'"></label>'}).join("");
  if(p)$("fsku").value=p.sku;else refreshSku();
  $("dlg").showModal();$("fname").focus()}

function saveProduct(){
  var name=$("fname").value.trim(),sku=$("fsku").value.trim().toUpperCase();
  if(!name){$("ferr").textContent="Enter a product name.";return}
  if(!sku){$("ferr").textContent="SKU can’t be empty. Use Regenerate to create one.";return}
  if(skuTaken(sku,editId)){$("ferr").textContent="That SKU is already used. Use Regenerate for a new one.";return}
  var d={sku:sku,name:name,cat:$("fcat").value,price:Math.max(0,parseFloat($("fprice").value)||0),qty:Math.max(0,parseInt($("fqty").value)||0),min:Math.max(0,parseInt($("fmin").value)||0),sup:$("fsup").value.trim(),notes:$("fnotes").value.trim(),cost:Math.max(0,parseFloat($("fcost").value)||0),x:{}};
  Array.prototype.forEach.call(document.querySelectorAll("[data-xf]"),function(i){d.x[i.dataset.xf]=i.value.trim()});
  d.track=$("ftrack").checked;if(!d.track){var pv=editId&&S.prods.find(function(p){return p.id===editId});d.min=0;d.qty=pv?(pv.qty>0?1:0):1}
  if(editId){Object.assign(S.prods.find(function(p){return p.id===editId}),d)}
  else{d.id=uid();S.prods.push(d);
    var m=sku.match(/^(.*)-(\d+)$/),code=(S.cats.find(function(c){return c.id===d.cat})||{}).code;
    if(m&&code&&(m[1]===code||m[1].indexOf(code+"-")===0)){S.seq[code]=Math.max(S.seq[code]||0,parseInt(m[2],10))}}
  save();$("dlg").close();render()}

$("new").onclick=function(){openForm()};
$("fcancel").onclick=function(){$("dlg").close()};
$("fsave").onclick=saveProduct;
$("fname").oninput=refreshSku;$("fcat").onchange=function(){refreshSku();if(!editId){$("ftrack").checked=catTrack($("fcat").value);syncTrack()}};$("ftrack").onchange=syncTrack;
$("fsku").oninput=function(){skuTouched=true};
$("regen").onclick=function(){skuTouched=false;var keep=editId;$("fsku").value=genSku($("fcat").value,$("fname").value).sku;skuTouched=!!keep};
$("q").oninput=render;$("fstat").onchange=render;$("fsort").onchange=render;$("range").onchange=render;$("ssave").onclick=saveSale;$("scancel").onclick=function(){$("sdlg").close()};$("csvbtn").onclick=function(){var c=$("csv");c.hidden=!c.hidden;if(!c.hidden){c.focus();c.select()}};
$("fadd").onclick=function(){var n=$("fldname").value.trim();if(!n||S.fields.some(function(f){return f.name.toLowerCase()===n.toLowerCase()}))return;S.fields.push({id:uid(),name:n});$("fldname").value="";save();render()};
$("fldname").addEventListener("keydown",function(e){if(e.key==="Enter")$("fadd").click()});

$("cadd").onclick=function(){
  var n=$("cname").value.trim(),c=($("ccode").value.trim()||codeFrom(n)).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  if(!n){$("cerr").textContent="Enter a category name.";return}
  if(S.cats.some(function(x){return x.name.toLowerCase()===n.toLowerCase()})){$("cerr").textContent="That category already exists.";return}
  if(S.cats.some(function(x){return x.code===c})){$("cerr").textContent="Code "+c+" is taken. Enter a different code.";return}
  S.cats.push({id:uid(),name:n,code:c,track:$("ctrack").checked});save();$("cname").value="";$("ccode").value="";$("cerr").textContent="";render()};
$("cname").addEventListener("keydown",function(e){if(e.key==="Enter")$("cadd").click()});

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-f],[data-dc],[data-e],[data-d],[data-q],[data-sell],[data-df],[data-undo],[data-tc],[data-tab],[data-vs],[data-mv]");if(!t)return;
  if(t.dataset.f){filter=t.dataset.f;render()}
  else if(t.dataset.dc){
    var id=t.dataset.dc;
    if(S.prods.some(function(p){return p.cat===id})){$("cerr").textContent="Move or delete this category’s products first.";return}
    S.cats=S.cats.filter(function(c){return c.id!==id});if(filter===id)filter="all";$("cerr").textContent="";save();render()}
  else if(t.dataset.e){openForm(t.dataset.e)}
  else if(t.dataset.d){var p=S.prods.find(function(x){return x.id===t.dataset.d});if(p&&confirm("Delete "+p.name+" ("+p.sku+")?")){S.prods=S.prods.filter(function(x){return x!==p});save();render()}}
  else if(t.dataset.q){var pr=S.prods.find(function(x){return x.id===t.dataset.id});pr.qty=Math.max(0,pr.qty+parseInt(t.dataset.q));save();render()}
  else if(t.dataset.sell){openSale(t.dataset.sell)}
  else if(t.dataset.mv){var mo=colKeys(),mi=mo.indexOf(t.dataset.mv),mj=mi+parseInt(t.dataset.dir),mt=mo[mi];if(mi>-1&&mj>=0&&mj<mo.length){mo[mi]=mo[mj];mo[mj]=mt;S.order=mo;save();render()}}
  else if(t.dataset.tab){view=t.dataset.tab;render()}
  else if(t.dataset.vs){if(confirm("Void this sale and put the item back in stock?"))voidSale(t.dataset.vs)}
  else if(t.dataset.undo){var up=S.prods.find(function(x){return x.id===t.dataset.undo});if(up){var ls=S.sales.filter(function(s){return s.pid===up.id}).pop();if(ls)voidSale(ls.id);else{up.qty=1;save();render()}}}
  else if(t.dataset.tc){var tcc=S.cats.find(function(c){return c.id===t.dataset.tc});tcc.track=tcc.track===false;save();render()}
  else if(t.dataset.df){S.fields=S.fields.filter(function(f){return f.id!==t.dataset.df});save();render()}});
init();
})();
</script>
